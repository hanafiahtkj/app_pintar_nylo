name: app_pintar_nylo
description: Aplikasi Banjarmasin Pintar refactored with Nylo v7.

publish_to: 'none'

version: 3.0.9+50

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nylo_framework: 7.5.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  flutter_widget_from_html: ^0.15.3
  flutter_inappwebview: ^6.1.4
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^22.0.1
  sign_in_with_apple: ^6.1.4
  in_app_update: ^4.2.3
  in_app_review: ^2.0.12
  app_links: ^7.0.0
  package_info_plus: ^10.0.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_new2.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - CHANGELOG.md
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/app_icon/
    - lang/

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product-Sans-Regular.ttf
        - asset: assets/fonts/Product-Sans-Italic.ttf
          style: italic
        - asset: assets/fonts/Product-Sans-Bold.ttf
          weight: 700
